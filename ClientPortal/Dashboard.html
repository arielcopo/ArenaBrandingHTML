<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Branding — Client Portal</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Phosphor Icons (Via CDN) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & GLOBAL RESET (Shared across Client & Admin Portals)
       ========================================================================== */
    :root {
      --color-navy: #292562;
      --color-navy-hover: #1e1b4b;
      --color-orange: #F0542B;
      --color-white: #FFFFFF;
      --color-bg-subtle: #F9FAFB;
      --color-border: #E5E5E5;
      --color-avatar-fallback: #A6A6A6;

      --font-family-base: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --nav-max-width: 1440px;
      --nav-gutter-desktop: 112px; /* 1440px - (112px * 2) = 1216px inner width */
      --nav-height-desktop: 96px;
      --nav-height-tablet: 80px;
      --nav-height-mobile: 72px;

      --transition-fast: 0.2s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family-base);
      background-color: var(--color-white);
      color: var(--color-navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ==========================================================================
       2. COMPONENT: CLIENT PORTAL NAVIGATION (DO NOT MODIFY FOR PAGE CONTENT)
       ========================================================================== */
    .portal-header {
      width: 100%;
      background-color: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* 3-Column Grid locks the center nav links to the exact horizontal center of the viewport */
    .portal-nav-container {
      width: 100%;
      max-width: var(--nav-max-width);
      height: var(--nav-height-desktop);
      margin: 0 auto;
      padding: 0 var(--nav-gutter-desktop);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }

    /* Brand Logo (Left Track) */
    .brand-logo-link {
      grid-column: 1;
      justify-self: start;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      line-height: 0;
    }

    .brand-logo-img {
      height: 42px;
      width: auto;
      max-width: 181px;
      object-fit: contain;
      display: block;
    }

    /* Desktop & Tablet Navigation Links (Center Track - Horizontal Row) */
    .nav-links-list {
      grid-column: 2;
      justify-self: center;
      list-style: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }

    .nav-link-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      text-transform: uppercase;
      color: var(--color-navy);
      padding: 4px 0;
      position: relative;
      white-space: nowrap;
    }

    /* Underline strictly targets .nav-link-text so (7) is never underlined */
    .nav-link-item:hover .nav-link-text,
    .nav-link-item.active .nav-link-text {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 10px;
    }

    .cart-count-badge {
      color: var(--color-orange);
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      text-decoration: none;
    }

    /* Right Controls: Profile Avatar & Mobile Hamburger Trigger (Right Track) */
    .nav-actions {
      grid-column: 3;
      justify-self: end;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
    }

    .profile-avatar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--color-avatar-fallback);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      transition: border-color var(--transition-fast);
    }

    .profile-avatar-btn:hover,
    .profile-avatar-btn:focus-visible {
      border-color: var(--color-navy);
      outline: none;
    }

    .profile-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Mobile Hamburger Button (Hidden on Desktop & Tablet) */
    .mobile-menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--color-navy);
      font-size: 24px;
    }

    /* Mobile Dropdown Drawer */
    .mobile-nav-drawer {
      display: none;
      width: 100%;
      background-color: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 20px 24px;
    }

    .mobile-nav-drawer.is-open {
      display: block;
    }

    .mobile-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      text-transform: uppercase;
      color: var(--color-navy);
    }

    /* Mobile Hover & Active: Clean 10px offset underline only, no background/shadow */
    .mobile-nav-link:hover .nav-link-text,
    .mobile-nav-link.active .nav-link-text {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 10px;
    }

    /* ==========================================================================
       3. RESPONSIVE BREAKPOINTS (Desktop -> Tablet -> Mobile)
       ========================================================================== */

    /* Small Desktop / Laptop (1025px – 1280px): Adjust side gutters smoothly */
    @media (max-width: 1280px) {
      .portal-nav-container {
        padding: 0 48px;
      }
    }

    /* Tablet Breakpoint (769px – 1024px) */
    @media (max-width: 1024px) {
      .portal-nav-container {
        height: var(--nav-height-tablet);
        padding: 0 32px;
        gap: 16px;
      }

      .brand-logo-svg {
        width: 156px;
        height: 36px;
      }

      .nav-links-list {
        gap: 16px;
      }

      .nav-link-item {
        font-size: 14px;
        line-height: 20px;
      }
    }

    /* Mobile Breakpoint (<= 768px): Show Burger Icon & Collapsible Menu */
    @media (max-width: 768px) {
      .portal-nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: var(--nav-height-mobile);
        padding: 0 20px;
      }

      .brand-logo-svg {
        width: 148px;
        height: 34px;
      }

      /* Hide inline desktop nav links */
      .nav-links-list {
        display: none;
      }

      /* Show burger button */
      .mobile-menu-toggle {
        display: inline-flex;
      }
    }

    /* ==========================================================================
       4. MAIN CONTENT & FOOTER LAYOUT PLACEHOLDERS
       ========================================================================== */
    .portal-main {
      flex: 1;
      width: 100%;
      max-width: var(--nav-max-width);
      margin: 0 auto;
      padding: 40px var(--nav-gutter-desktop);
    }

    @media (max-width: 1280px) {
      .portal-main {
        padding: 32px 48px;
      }
    }

    @media (max-width: 1024px) {
      .portal-main {
        padding: 28px 32px;
      }
    }

    @media (max-width: 768px) {
      .portal-main {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       START COMPONENT: CLIENT PORTAL NAVIGATION
       Locked component — add page body and footer below without altering this block.
       ======================================================================== -->
  <header class="portal-header" id="clientPortalHeader">
    <nav class="portal-nav-container" aria-label="Client Portal Primary Navigation">

      <!-- Arena Branding Logo (Exact Figma Vector Geometry) -->
      <a href="#dashboard" class="brand-logo-link" aria-label="Arena Branding Home">
        <img
          src="https://arenabranding.com.au/wp-content/uploads/2026/11/ArenaBrandingLogo.png"
          alt="Arena Branding"
          class="brand-logo-img"
        />
      </a>

      <!-- Center Navigation Links (Desktop & Tablet) -->
      <ul class="nav-links-list">
        <li>
          <a href="#dashboard" class="nav-link-item active" data-nav-link>
            <span class="nav-link-text">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#products" class="nav-link-item" data-nav-link>
            <span class="nav-link-text">Products</span>
          </a>
        </li>
        <li>
          <a href="#favorites" class="nav-link-item" data-nav-link>
            <span class="nav-link-text">My Favorites</span>
          </a>
        </li>
        <li>
          <a href="#cart" class="nav-link-item" data-nav-link>
            <span class="nav-link-text">Cart Items</span>
            <span class="cart-count-badge">(7)</span>
          </a>
        </li>
      </ul>

      <!-- Right Controls: Profile Circle & Mobile Burger Trigger -->
      <div class="nav-actions">
        <!-- Profile Avatar Button (Placeholder ready for Profile Dropdown UI) -->
        <button
          type="button"
          class="profile-avatar-btn"
          id="profileMenuTrigger"
          aria-label="Open user profile menu"
          aria-expanded="false"
        >
          <!-- Replace src with dynamic user avatar URL; falls back cleanly to #A6A6A6 -->
          <img
            src=""
            alt="User profile"
            class="profile-avatar-img"
            onerror="this.style.display='none'"
          />
        </button>

        <!-- Placeholder for Future Profile Dropdown Menu -->
        <!-- [INSERT PROFILE DROPDOWN UI HERE] -->

        <!-- Mobile Burger Menu Button (Phosphor Icons) -->
        <button
          type="button"
          class="mobile-menu-toggle"
          id="mobileMenuBtn"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="mobileNavDrawer"
        >
          <i class="ph ph-list" id="mobileMenuIcon" aria-hidden="true"></i>
        </button>
      </div>
    </nav>

    <!-- Collapsible Mobile Navigation Drawer -->
    <div class="mobile-nav-drawer" id="mobileNavDrawer">
      <ul class="mobile-nav-list">
        <li>
          <a href="#dashboard" class="mobile-nav-link active" data-nav-link>
            <span class="nav-link-text">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#products" class="mobile-nav-link" data-nav-link>
            <span class="nav-link-text">Products</span>
          </a>
        </li>
        <li>
          <a href="#favorites" class="mobile-nav-link" data-nav-link>
            <span class="nav-link-text">My Favorites</span>
          </a>
        </li>
        <li>
          <a href="#cart" class="mobile-nav-link" data-nav-link>
            <span class="nav-link-text">Cart Items</span>
            <span class="cart-count-badge">(7)</span>
          </a>
        </li>
      </ul>
    </div>
  </header>
  <!-- ========================================================================
       END COMPONENT: CLIENT PORTAL NAVIGATION
       ======================================================================== -->


  <!-- ========================================================================
       START SLOT: MAIN PAGE BODY CONTENT
       Insert Dashboard, Products, Favorites, or Cart views inside <main>.
       ======================================================================== -->
  <main class="portal-main" id="mainContent">
    <!-- Page body components will go here -->
  </main>
  <!-- ========================================================================
       END SLOT: MAIN PAGE BODY CONTENT
       ======================================================================== -->


  <!-- ========================================================================
       START COMPONENT: CLIENT PORTAL FOOTER
       Insert Footer HTML here when ready.
       ======================================================================== -->
  <footer id="clientPortalFooter">
    <!-- Footer component will go here -->
  </footer>
  <!-- ========================================================================
       END COMPONENT: CLIENT PORTAL FOOTER
       ======================================================================== -->


  <!-- ========================================================================
       COMPONENT SCRIPTS: NAVIGATION INTERACTIVITY
       ======================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenuIcon = document.getElementById('mobileMenuIcon');
      const mobileNavDrawer = document.getElementById('mobileNavDrawer');
      const navLinks = document.querySelectorAll('[data-nav-link]');

      // Toggle Mobile Drawer & Swap Phosphor Burger / Close Icon
      function toggleMobileMenu(forceClose = false) {
        const isCurrentlyOpen = mobileNavDrawer.classList.contains('is-open');
        const shouldOpen = forceClose ? false : !isCurrentlyOpen;

        mobileNavDrawer.classList.toggle('is-open', shouldOpen);
        mobileMenuBtn.setAttribute('aria-expanded', String(shouldOpen));

        if (shouldOpen) {
          mobileMenuIcon.classList.remove('ph-list');
          mobileMenuIcon.classList.add('ph-x');
        } else {
          mobileMenuIcon.classList.remove('ph-x');
          mobileMenuIcon.classList.add('ph-list');
        }
      }

      mobileMenuBtn.addEventListener('click', () => toggleMobileMenu());

      // Sync Active Link State Across Desktop & Mobile Navigation
      navLinks.forEach((link) => {
        link.addEventListener('click', () => {
          const targetHref = link.getAttribute('href');

          navLinks.forEach((item) => {
            item.classList.toggle('active', item.getAttribute('href') === targetHref);
          });

          // Close mobile menu after selecting an item
          toggleMobileMenu(true);
        });
      });

      // Automatically close mobile drawer if resized above mobile breakpoint
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768 && mobileNavDrawer.classList.contains('is-open')) {
          toggleMobileMenu(true);
        }
      });
    });
  </script>
</body>
</html>
